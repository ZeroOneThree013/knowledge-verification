<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史紀錄統整 - 知識驗證</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#3980f4',
              secondary: '#9466ff',
              surface: '#faf8ff',
              'on-surface': '#131b2e'
            },
            fontFamily: {
              sans: ['"Noto Sans TC"', 'sans-serif'],
              headline: ['Manrope', '"Noto Sans TC"', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24; }
      .signature-gradient { background: linear-gradient(135deg, #3980f4 0%, #9466ff 100%); }
    </style>
</head>
<body class="bg-[#faf8ff] text-[#131b2e] min-h-screen">
    <header class="w-full bg-[#faf8ff]/80 backdrop-blur-xl fixed top-0 z-50 shadow-[0px_12px_32px_rgba(19,27,46,0.04)] border-b border-[#3980f4]/10">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="window.openMobileMenu()" class="p-2 -ml-2 mr-1 hover:bg-[#f2f3ff] rounded-lg transition-all text-[#3980f4] active:scale-95"><span class="material-symbols-outlined">menu</span></button>
                <span class="material-symbols-outlined text-[#3980f4]" data-icon="verified_user">verified_user</span>
                <span class="text-xl font-extrabold bg-gradient-to-br from-[#3980f4] to-[#9466ff] bg-clip-text text-transparent font-['Manrope'] tracking-tight">知識驗證</span>
                <span class="hidden md:flex items-center gap-1 ml-4 text-sm font-bold text-[#3980f4]">
                    <span class="material-symbols-outlined text-transparent bg-gradient-to-br from-[#3980f4] to-[#9466ff] bg-clip-text text-[18px]">insert_chart</span>
                    <span>歷史紀錄統計</span>
                </span>
            </div>
            <a href="quiz.html" class="flex items-center gap-2 px-6 py-2 rounded-full font-bold text-[#faf8ff] signature-gradient shadow-lg hover:scale-105 active:scale-95 transition-all">
                繼續測驗 <span class="material-symbols-outlined text-sm">arrow_forward</span>
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 pt-32 pb-24">
        <div class="mb-12">
            <h1 class="text-4xl font-black tracking-tight mb-4 text-[#131b2e]">學習成果分析 📊</h1>
            <p class="text-[#3980f4] font-medium text-lg">透過歷次測驗分數，觀察您的知識成長軌跡</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="bg-white p-6 rounded-3xl shadow-xl shadow-[#3980f4]/10 border border-[#3980f4]/10 flex flex-col justify-center items-center">
                <span class="text-sm font-bold text-[#9466ff] uppercase tracking-wider mb-2">測驗總次數</span>
                <span id="stat-total-tests" class="text-5xl font-black text-[#131b2e]">0</span>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl shadow-[#3980f4]/10 border border-[#3980f4]/10 flex flex-col justify-center items-center">
                <span class="text-sm font-bold text-[#9466ff] uppercase tracking-wider mb-2">最高得分率</span>
                <span id="stat-best-score" class="text-5xl font-black text-[#131b2e]">0%</span>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-xl shadow-[#3980f4]/10 border border-[#3980f4]/10 flex flex-col justify-center items-center">
                <span class="text-sm font-bold text-[#9466ff] uppercase tracking-wider mb-2">平均得分率</span>
                <span id="stat-avg-score" class="text-5xl font-black text-[#131b2e]">0%</span>
            </div>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-2xl shadow-[#131b2e]/5 border border-[#3980f4]/10 mb-12">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <span class="material-symbols-outlined text-[#3980f4]">show_chart</span> 分數趨勢圖
            </h2>
            <div class="w-full relative h-[300px]">
                <canvas id="historyChart"></canvas>
            </div>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-2xl shadow-[#131b2e]/5 border border-[#3980f4]/10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold flex items-center gap-3">
                    <span class="material-symbols-outlined text-[#9466ff]">history</span> 詳細歷史紀錄
                </h2>
                <button id="edit-mode-btn" onclick="toggleEditMode()" class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold text-[#3980f4] hover:bg-[#f2f3ff] transition-all">
                    <span class="material-symbols-outlined text-[20px]">edit</span>
                    <span id="edit-btn-text">編輯</span>
                </button>
            </div>
            <div id="history-list" class="space-y-4">
               <!-- injected by js -->
            </div>
        </div>
    </main>

    <!-- 答題詳情 Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-[#131b2e]/60 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="if(event.target===this)closeDetailModal()">
        <div id="detail-modal-content" class="bg-white w-full max-w-2xl max-h-[85vh] rounded-[2rem] shadow-2xl flex flex-col transform scale-95 transition-transform duration-300 relative">
            <!-- Header -->
            <div class="p-6 flex justify-between items-center border-b border-[#3980f4]/10 shrink-0">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-[#9466ff]">history_edu</span>
                    <h2 id="detail-modal-title" class="font-headline font-bold text-lg text-[#131b2e] leading-tight"></h2>
                </div>
                <button onclick="closeDetailModal()" class="p-2 hover:bg-[#f2f3ff] rounded-full transition-colors text-[#131b2e]/60">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <!-- Body -->
            <div id="detail-modal-body" class="overflow-y-auto p-6 flex-1"></div>
        </div>
    </div>

    <!-- Mobile Navigation Backdrop -->
    <div id="mobile-menu-backdrop" onclick="window.closeMobileMenu()" class="fixed inset-0 bg-black/50 z-[55] hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Mobile Navigation Sidebar -->
    <aside id="mobile-menu" class="fixed top-0 left-0 h-full w-72 bg-[#faf8ff] z-[60] transform -translate-x-full transition-transform duration-300 shadow-[24px_0_48px_rgba(19,27,46,0.1)] flex flex-col">
        <div class="p-6 flex justify-between items-center border-b border-[#3980f4]/10">
            <span class="text-xl font-black bg-gradient-to-br from-[#3980f4] to-[#9466ff] bg-clip-text text-transparent">導覽選單</span>
            <button onclick="window.closeMobileMenu()" class="p-2 hover:bg-[#f2f3ff] rounded-full transition-colors text-[#131b2e]">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-2 px-4">
            <a href="/" class="flex items-center gap-4 px-4 py-4 rounded-xl font-bold font-headline text-[#131b2e] hover:bg-[#f2f3ff] transition-colors">
                <span class="material-symbols-outlined text-[#3980f4]">home</span>
                系統首頁
            </a>
            <a href="teaching.html" class="flex items-center gap-4 px-4 py-4 rounded-xl font-bold font-headline text-[#131b2e] hover:bg-[#f2f3ff] transition-colors">
                <span class="material-symbols-outlined text-[#9466ff]">import_contacts</span>
                知識教學卡片
            </a>
            <a href="quiz.html" class="flex items-center gap-4 px-4 py-4 rounded-xl font-bold font-headline text-[#131b2e] hover:bg-[#f2f3ff] transition-colors">
                <span class="material-symbols-outlined text-[#f439a3]">quiz</span>
                AI 深度測驗
            </a>
            <a href="history.html" class="flex items-center gap-4 px-4 py-4 rounded-xl font-bold font-headline text-[#3980f4] bg-[#f2f3ff] transition-colors">
                <span class="material-symbols-outlined text-transparent bg-gradient-to-br from-[#3980f4] to-[#9466ff] bg-clip-text">insert_chart</span>
                歷史紀錄統計
            </a>
        </div>
        <div class="p-6 border-t border-[#3980f4]/10 text-xs text-[#131b2e]/60 text-center font-bold">
            The Digital Archivist © 2024
        </div>
    </aside>

    <script>
        let myChart = null;
        let isEditMode = false;
        let history = [];

        window.openMobileMenu = function() {
            const backdrop = document.getElementById('mobile-menu-backdrop');
            const menu = document.getElementById('mobile-menu');
            backdrop.classList.remove('hidden');
            void backdrop.offsetWidth; 
            backdrop.classList.remove('opacity-0');
            backdrop.classList.add('opacity-100');
            menu.classList.remove('-translate-x-full');
            menu.classList.add('translate-x-0');
        }
        window.closeMobileMenu = function() {
            const backdrop = document.getElementById('mobile-menu-backdrop');
            const menu = document.getElementById('mobile-menu');
            backdrop.classList.remove('opacity-100');
            backdrop.classList.add('opacity-0');
            menu.classList.remove('translate-x-0');
            menu.classList.add('-translate-x-full');
            setTimeout(() => backdrop.classList.add('hidden'), 300);
        }

        function loadHistory() {
            try {
                history = JSON.parse(localStorage.getItem('quizHistory') || '[]');
                if (!Array.isArray(history)) history = [];
            } catch(e) {
                history = [];
            }
        }

        window.toggleEditMode = function() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('edit-mode-btn');
            const btnText = document.getElementById('edit-btn-text');
            const btnIcon = btn.querySelector('.material-symbols-outlined');
            
            if (isEditMode) {
                btnText.innerText = '完成';
                btnIcon.innerText = 'check';
                btn.classList.add('bg-[#f2f3ff]');
            } else {
                btnText.innerText = '編輯';
                btnIcon.innerText = 'edit';
                btn.classList.remove('bg-[#f2f3ff]');
            }
            renderHistoryList();
        }

        window.deleteRecord = function(index, event) {
            if (event) event.stopPropagation();
            if (confirm('確定要刪除這筆測驗紀錄嗎？')) {
                history.splice(index, 1);
                localStorage.setItem('quizHistory', JSON.stringify(history));
                renderAll();
            }
        }

        function renderAll() {
            loadHistory();
            renderStats();
            renderChart();
            renderHistoryList();
        }

        function renderStats() {
            const totalTests = history.length;
            let bestScore = 0;
            let totalScorePercents = 0;

            history.forEach(h => {
                const percent = Math.round((h.score / h.total) * 100) || 0;
                if (percent > bestScore) bestScore = percent;
                totalScorePercents += percent;
            });

            document.getElementById('stat-total-tests').innerText = totalTests;
            document.getElementById('stat-best-score').innerText = bestScore + '%';
            document.getElementById('stat-avg-score').innerText = (totalTests > 0 ? Math.round(totalScorePercents / totalTests) : 0) + '%';
        }

        function renderChart() {
            const labels = [];
            const dataPoints = [];
            history.forEach((h, i) => {
                labels.push(`第 ${i+1} 次`);
                dataPoints.push(Math.round((h.score / h.total) * 100) || 0);
            });

            const canvas = document.getElementById('historyChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (myChart) myChart.destroy();

            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(57, 128, 244, 0.4)');
            gradient.addColorStop(1, 'rgba(57, 128, 244, 0)');

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '得分率 (%)',
                        data: dataPoints,
                        borderColor: '#3980f4',
                        backgroundColor: gradient,
                        borderWidth: 4,
                        pointBackgroundColor: '#9466ff',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 3,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { font: { family: 'Manrope', weight: 'bold' }, color: '#131b2e' },
                            grid: { color: 'rgba(57, 128, 244, 0.1)', drawBorder: false }
                        },
                        x: {
                            ticks: { font: { family: 'Noto Sans TC', weight: 'bold' }, color: '#131b2e' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function renderHistoryList() {
            const listContainer = document.getElementById('history-list');
            if (history.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-[#9466ff] font-bold bg-[#f2f3ff] rounded-2xl">目前還沒有任何測驗紀錄哦！快去挑戰一下吧！</div>`;
                return;
            }

            listContainer.innerHTML = '';
            [...history].reverse().forEach((h, index) => {
                const totalTests = history.length;
                const percent = Math.round((h.score / h.total) * 100) || 0;
                let scoreColor = percent >= 80 ? 'text-[#3980f4]' : (percent >= 60 ? 'text-[#9466ff]' : 'text-[#f439a3]');
                let bgColor = percent >= 80 ? 'bg-[#3980f4]/10' : (percent >= 60 ? 'bg-[#9466ff]/10' : 'bg-[#f439a3]/10');
                const realIndex = history.length - 1 - index;

                listContainer.innerHTML += `
                    <div onclick="${isEditMode ? '' : 'openDetailModal(' + realIndex + ')'}" class="flex items-center justify-between p-5 rounded-2xl bg-[#faf8ff] ${isEditMode ? '' : 'hover:shadow-md hover:translate-y-[-1px] cursor-pointer'} transition-all duration-200 border border-[#3980f4]/5 group relative overflow-hidden">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-full ${bgColor} flex items-center justify-center ${scoreColor} font-black text-lg">
                                ${percent}%
                            </div>
                            <div>
                                <h3 class="font-bold text-[#131b2e] text-lg">測驗任務 #${totalTests - index}</h3>
                                <p class="text-sm text-[#131b2e]/60 font-medium">${h.date}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="text-right font-black text-[#131b2e] text-lg mr-1">
                                ${h.score} <span class="text-sm text-[#131b2e]/40">/ ${h.total} 題</span>
                            </div>
                            ${isEditMode ? `
                                <button onclick="deleteRecord(${realIndex}, event)" class="p-2 bg-[#ffdad6] text-[#93000a] rounded-xl hover:scale-110 active:scale-95 transition-all flex items-center justify-center">
                                    <span class="material-symbols-outlined text-[20px]">delete</span>
                                </button>
                            ` : `
                                <span class="material-symbols-outlined text-[#3980f4]/40 group-hover:text-[#3980f4] transition-colors text-[18px]">chevron_right</span>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', renderAll);

            // 答題詳情 Modal
            window.openDetailModal = function(idx) {
                const h = history[idx];
                if (!h) return;
                const modalTitle = document.getElementById('detail-modal-title');
                const modalBody = document.getElementById('detail-modal-body');
                modalTitle.innerText = `測驗任務 #${idx + 1}　${h.date}`;

                if (!h.questions || h.questions.length === 0) {
                    modalBody.innerHTML = `<div class="p-8 text-center text-[#9466ff] font-bold bg-[#f2f3ff] rounded-2xl">此次紀錄為舊版格式，未儲存題目詳情。<br/>請重新進行一次測驗以啟用詳細記憶。</div>`;
                } else {
                    modalBody.innerHTML = h.questions.map((q, i) => {
                        const isCorrect = q.userAnswer === q.answer;
                        const optionsHtml = (q.options || []).map(opt => {
                            let cls = 'border border-gray-200 bg-[#faf8ff] text-[#131b2e]';
                            if (opt === q.answer) cls = 'border-2 border-[#3980f4] bg-[#3980f4]/10 text-[#3980f4] font-bold';
                            if (opt === q.userAnswer && !isCorrect) cls = 'border-2 border-[#f439a3] bg-[#f439a3]/10 text-[#f439a3] font-bold line-through';
                            const icon = opt === q.answer
                                ? `<span class="material-symbols-outlined text-[#3980f4] text-[16px]">task_alt</span>`
                                : (opt === q.userAnswer && !isCorrect ? `<span class="material-symbols-outlined text-[#f439a3] text-[16px]">cancel</span>` : `<span class="w-4 inline-block shrink-0"></span>`);
                            return `<div class="flex items-center gap-3 p-3 rounded-xl text-sm ${cls}">${icon}<span>${opt}</span></div>`;
                        }).join('');
                        return `<div class="mb-5 p-5 rounded-2xl ${isCorrect ? 'bg-[#f0f7ff] border border-[#3980f4]/15' : 'bg-[#fff5f8] border border-[#f439a3]/15'}">
                            <div class="flex items-start gap-2 mb-3">
                                <span class="material-symbols-outlined text-[18px] shrink-0 mt-0.5 ${isCorrect ? 'text-[#3980f4]' : 'text-[#f439a3]'}">${isCorrect ? 'check_circle' : 'cancel'}</span>
                                <p class="font-bold text-[#131b2e] text-sm leading-relaxed">第 ${i+1} 題：${q.question}</p>
                            </div>
                            <div class="space-y-2 ml-6">${optionsHtml}</div>
                        </div>`;
                    }).join('');
                }

                const modal = document.getElementById('detail-modal');
                const content = document.getElementById('detail-modal-content');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                void modal.offsetWidth;
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
                document.body.style.overflow = 'hidden';
            };

            window.closeDetailModal = function() {
                const modal = document.getElementById('detail-modal');
                const content = document.getElementById('detail-modal-content');
                modal.classList.add('opacity-0');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                document.body.style.overflow = 'auto';
                setTimeout(() => { modal.classList.remove('flex'); modal.classList.add('hidden'); }, 300);
            };
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
      const cacheBuster = "?v=" + new Date().getTime();
      document.querySelectorAll('a').forEach(a => {
          let href = a.getAttribute('href');
          if (href && !href.startsWith('http') && !href.startsWith('#') && !href.includes('?v=')) {
              a.setAttribute('href', href.split('?')[0] + cacheBuster);
          }
      });
  });
</script>
</body>
</html>
